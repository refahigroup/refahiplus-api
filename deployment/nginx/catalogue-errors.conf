# Include inside each server{} using the catalogue location snippets.
location @catalogue_api_rate_error {
    default_type application/json;
    charset utf-8;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    access_log /var/log/nginx/catalogue.json catalogue_safe;
    error_log /var/log/nginx/catalogue-error.log crit;
    return 429 '{"success":false,"message":"تعداد درخواست‌ها بیش از حد مجاز است؛ کمی بعد دوباره تلاش کنید.","errors":null,"statusCode":429,"traceId":null}';
}
location @catalogue_page_rate_error {
    default_type text/plain;
    charset utf-8;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    access_log /var/log/nginx/catalogue.json catalogue_safe;
    error_log /var/log/nginx/catalogue-error.log crit;
    return 429 'تعداد درخواست‌ها بیش از حد مجاز است؛ کمی بعد دوباره تلاش کنید.';
}
