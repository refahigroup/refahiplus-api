# Include in the EXISTING /api/catalogue/ proxy location; keep its proxy_pass.
limit_req zone=catalogue_per_ip burst=40 nodelay;
limit_req_status 429;
error_page 429 = @catalogue_api_rate_error;
access_log /var/log/nginx/catalogue.json catalogue_safe;
# Nginx's rejection error messages otherwise contain the original query string.
error_log /var/log/nginx/catalogue-error.log crit;
proxy_intercept_errors off;
