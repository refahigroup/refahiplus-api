stages:
  - build
  - image


# ------------------------------------------------------------
# Create pipelines only for the same branches that GitHub
# Actions previously handled.
# ------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
    - when: never


# ------------------------------------------------------------
# Global settings
# ------------------------------------------------------------

default:
  tags:
    - refahiplus-docker


variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

  # Workaround for GitLab Registry / BuildKit attestation issue.
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"


# ------------------------------------------------------------
# .NET Build / Publish
# Equivalent to:
#   setup-dotnet
#   dotnet restore
#   dotnet build
#   dotnet publish
# ------------------------------------------------------------

dotnet-build:
  stage: build

  image: mcr.microsoft.com/dotnet/sdk:10.0

  script:
    - |
      set -eu

      echo "=== RefahiPlus API Build ==="
      echo "Project: $CI_PROJECT_PATH"
      echo "Branch: $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"

      echo ""
      echo "=== .NET Version ==="
      dotnet --version

      echo ""
      echo "=== Restore ==="
      dotnet restore ./Refahi.Backend.slnx

      echo ""
      echo "=== Build Solution ==="
      dotnet build \
        ./Refahi.Backend.slnx \
        --configuration Release

      echo ""
      echo "=== Publish Refahi.Api ==="
      dotnet publish \
        ./src/Refahi.Api/Refahi.Api.csproj \
        --configuration Release \
        --no-build

      echo ""
      echo "=== Build completed successfully ==="

  artifacts:
    paths:
      - src/Refahi.Api/bin/Release/
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'


# ------------------------------------------------------------
# Docker Build / Push
#
# main    -> :prod
# staging -> :stage
#
# Every build also gets an immutable commit tag.
# ------------------------------------------------------------

docker-image:
  stage: image

  image: docker:29.7.2-cli

  needs:
    - job: dotnet-build
      artifacts: true

  before_script:
    - |
      set -eu

      echo "=== Container Registry Login ==="
      echo "Registry: $CI_REGISTRY"
      echo "Image: $CI_REGISTRY_IMAGE"

      echo "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    - |
      set -eu

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ENV_TAG="prod"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        ENV_TAG="stage"
      else
        echo "Unsupported branch: $CI_COMMIT_BRANCH"
        exit 1
      fi

      SHA_TAG="$CI_COMMIT_SHORT_SHA"

      ENV_IMAGE="$CI_REGISTRY_IMAGE:$ENV_TAG"
      SHA_IMAGE="$CI_REGISTRY_IMAGE:$SHA_TAG"

      echo ""
      echo "=== Docker Build ==="
      echo "Environment tag: $ENV_TAG"
      echo "Environment image: $ENV_IMAGE"
      echo "Immutable image: $SHA_IMAGE"

      docker build \
        --provenance=false \
        -f ./src/Refahi.Api/Dockerfile \
        -t "$ENV_IMAGE" \
        -t "$SHA_IMAGE" \
        .

      echo ""
      echo "=== Push immutable image ==="

      docker push "$SHA_IMAGE"

      echo ""
      echo "=== Push environment image ==="

      docker push "$ENV_IMAGE"

      echo ""
      echo "=== Docker image published successfully ==="
      echo "$SHA_IMAGE"
      echo "$ENV_IMAGE"

  after_script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ENV_TAG="prod"
      else
        ENV_TAG="stage"
      fi

      docker image rm \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        "$CI_REGISTRY_IMAGE:$ENV_TAG" \
        >/dev/null 2>&1 || true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
