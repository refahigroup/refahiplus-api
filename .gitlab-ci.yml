stages:
  - smoke

runner-smoke:
  stage: smoke

  image: docker:29.7.2-cli

  tags:
    - refahiplus-docker

  script:
    - echo "=== GitLab Runner Smoke Test ==="
    - echo "Project: $CI_PROJECT_PATH"
    - echo "Branch: $CI_COMMIT_REF_NAME"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Runner: $CI_RUNNER_DESCRIPTION"
    - echo "=== Docker Client/Server ==="
    - docker version
    - echo "=== Docker Info ==="
    - docker info

  rules:
    - when: always
