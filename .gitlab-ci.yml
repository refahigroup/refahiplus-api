stages:
  - build
  - image


# ============================================================
# Pipeline rules
# Equivalent to the previous GitHub Actions triggers:
#
#   main    -> prod
#   staging -> stage
# ============================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
    - when: never


# ============================================================
# Default Runner
# ============================================================

default:
  tags:
    - refahiplus-docker


# ============================================================
# Global variables
# ============================================================

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

  # Persist NuGet packages on the GitLab Runner host.
  # Runner already has /cache mounted.
  NUGET_PACKAGES: "/cache/nuget"

  # Prevent BuildKit provenance/attestation issue with
  # the local GitLab Container Registry.
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"


# ============================================================
# Stage 1
# Restore -> Build -> Publish
# ============================================================

dotnet-build:
  stage: build

  image: mcr.microsoft.com/dotnet/sdk:10.0

  script:
    - |
      set -eu

      echo "========================================"
      echo " RefahiPlus API Build"
      echo "========================================"

      echo "Project : $CI_PROJECT_PATH"
      echo "Branch  : $CI_COMMIT_BRANCH"
      echo "Commit  : $CI_COMMIT_SHA"

      echo ""
      echo "=== .NET SDK ==="

      dotnet --version

      echo ""
      echo "=== Configure outbound proxy ==="

      if [ -z "${OUTBOUND_PROXY:-}" ]; then
        echo "ERROR: OUTBOUND_PROXY GitLab CI variable is not configured."
        exit 1
      fi

      export HTTP_PROXY="$OUTBOUND_PROXY"
      export HTTPS_PROXY="$OUTBOUND_PROXY"
      export http_proxy="$OUTBOUND_PROXY"
      export https_proxy="$OUTBOUND_PROXY"

      export NO_PROXY="localhost,127.0.0.1,git.refahi.xyz,registry.refahi.xyz"
      export no_proxy="$NO_PROXY"

      echo "Outbound proxy configured."

      echo ""
      echo "=== NuGet Sources ==="

      dotnet nuget list source

      echo ""
      echo "=== Restore ==="

      dotnet restore \
        ./Refahi.Backend.slnx \
        --disable-parallel

      echo ""
      echo "=== Build Solution ==="

      dotnet build \
        ./Refahi.Backend.slnx \
        --configuration Release \
        --no-restore

      echo ""
      echo "=== Publish Refahi.Api ==="

      rm -rf .publish/api
      mkdir -p .publish/api

      dotnet publish \
        ./src/Refahi.Api/Refahi.Api.csproj \
        --configuration Release \
        --no-build \
        --no-restore \
        --output "$CI_PROJECT_DIR/.publish/api"

      echo ""
      echo "=== Publish output ==="

      du -sh .publish/api

      echo ""
      echo "=== Build completed successfully ==="

  artifacts:
    name: "refahi-api-$CI_COMMIT_SHORT_SHA"
    paths:
      - .publish/api/
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'


# ============================================================
# Stage 2
# Build Runtime Docker Image -> Push Local Registry
#
# Important:
# We DO NOT execute dotnet restore/build inside Docker again.
# The published artifact from the previous job is used directly.
# ============================================================

docker-image:
  stage: image

  image: docker:29.7.2-cli

  needs:
    - job: dotnet-build
      artifacts: true

  before_script:
    - |
      set -eu

      echo "========================================"
      echo " GitLab Container Registry"
      echo "========================================"

      echo "Registry : $CI_REGISTRY"
      echo "Image    : $CI_REGISTRY_IMAGE"

      echo "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    - |
      set -eu

      echo ""
      echo "=== Resolve Environment ==="

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ENV_TAG="prod"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        ENV_TAG="stage"
      else
        echo "Unsupported branch: $CI_COMMIT_BRANCH"
        exit 1
      fi

      SHA_TAG="$CI_COMMIT_SHORT_SHA"

      ENV_IMAGE="$CI_REGISTRY_IMAGE:$ENV_TAG"
      SHA_IMAGE="$CI_REGISTRY_IMAGE:$SHA_TAG"

      echo "Environment : $ENV_TAG"
      echo "SHA image   : $SHA_IMAGE"
      echo "Env image   : $ENV_IMAGE"

      echo ""
      echo "=== Validate Published Application ==="

      test -f .publish/api/Refahi.Api.dll

      du -sh .publish/api

      echo ""
      echo "=== Create Runtime Dockerfile ==="

      cat > .publish/api/Dockerfile.ci <<'EOF'
      FROM mcr.microsoft.com/dotnet/aspnet:10.0

      WORKDIR /app

      EXPOSE 8080

      COPY . .

      ENTRYPOINT ["dotnet", "Refahi.Api.dll"]
      EOF

      echo ""
      echo "=== Docker Build ==="

      docker build \
        --provenance=false \
        --file .publish/api/Dockerfile.ci \
        --tag "$SHA_IMAGE" \
        --tag "$ENV_IMAGE" \
        .publish/api

      echo ""
      echo "=== Push Immutable SHA Image ==="

      docker push "$SHA_IMAGE"

      echo ""
      echo "=== Push Environment Image ==="

      docker push "$ENV_IMAGE"

      echo ""
      echo "========================================"
      echo " Docker Image Published Successfully"
      echo "========================================"

      echo "Immutable : $SHA_IMAGE"
      echo "Environment: $ENV_IMAGE"

  after_script:
    - |
      echo ""
      echo "=== Local Docker Cleanup ==="

      if [ -n "${CI_REGISTRY_IMAGE:-}" ] && \
         [ -n "${CI_COMMIT_SHORT_SHA:-}" ]; then

        docker image rm \
          "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
          >/dev/null 2>&1 || true
      fi

      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker image rm \
          "$CI_REGISTRY_IMAGE:prod" \
          >/dev/null 2>&1 || true

      elif [ "${CI_COMMIT_BRANCH:-}" = "staging" ]; then
        docker image rm \
          "$CI_REGISTRY_IMAGE:stage" \
          >/dev/null 2>&1 || true
      fi

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
