stages:
  - build
  - verify
  - docker
  - notify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never

variables:
  SOLUTION: "Refahi.Backend.slnx"
  API_CSPROJ: "src/Refahi.Api/Refahi.Api.csproj"
  SERVICE_NAME: "api"
  PUBLISH_DIR: "publish/api"
  # Must match the architecture/libc of the ASP.NET runtime image.
  API_RUNTIME: "linux-x64"

  # NuGet
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"
  NUGET_XMLDOC_MODE: "skip"

  # .NET
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NuGetAudit: "true"
  NuGetAuditMode: "all"
  NuGetAuditLevel: "moderate"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

  # Docker
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

default:
  tags:
    - refahiplus-docker

  cache:
    key: "nuget-${CI_PROJECT_ID}"
    paths:
      - .nuget/packages/
    policy: pull-push


# ============================================================
# BUILD / TEST / PUBLISH
# ============================================================

build_publish:
  stage: build

  image: registry.refahi.xyz/platform/ci-images/dotnet-sdk:10.0

  services:
    - name: registry.refahi.xyz/platform/ci-images/postgres:16-alpine
      alias: postgres

  variables:
    POSTGRES_DB: "refahi_wallets_tests"
    POSTGRES_USER: "refahi"
    POSTGRES_PASSWORD: "refahi"
    REFAHI_WALLETS_TEST_CONNECTION: "Host=postgres;Port=5432;Database=refahi_wallets_tests;Username=refahi;Password=refahi"
    REFAHI_DISPOSABLE_CI_DATABASE: "true"
    REFAHI_HOTEL_TEST_DATABASE: "Host=postgres;Port=5432;Database=hotel_city_test_${CI_PIPELINE_ID}_${CI_JOB_ID};Username=refahi;Password=refahi"
    REFAHI_ENTERTAINMENTS_TEST_CONNECTION: "Host=postgres;Port=5432;Database=entertainments_test_${CI_PIPELINE_ID}_${CI_JOB_ID};Username=refahi;Password=refahi"

    ConnectionStrings__Default:
      "Host=postgres;Port=5432;Database=refahi_wallets_tests;Username=refahi;Password=refahi"

  script:
    - |
      set -eu

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        ENV="mr-${CI_MERGE_REQUEST_IID}"
      else
      case "$CI_COMMIT_BRANCH" in
        main)
          ENV="prod"
          ;;
        staging)
          ENV="stage"
          ;;
        dev)
          ENV="dev"
          ;;
        *)
          echo "Unsupported target branch"
          exit 1
          ;;
      esac
      fi

      BUILD_VERSION="${ENV}-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"

      echo "ENV=$ENV" > build.env
      echo "BUILD_VERSION=$BUILD_VERSION" >> build.env

      echo "========================================"
      echo " RefahiPlus API Build"
      echo "========================================"
      echo "Branch: $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"
      echo "Environment: $ENV"
      echo "Version: $BUILD_VERSION"

      echo ""
      echo "=== .NET SDK ==="
      dotnet --version

      echo ""
      echo "=== Create CI NuGet Config ==="

      cat > NuGet.CI.Config <<EOF
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <packageSources>
          <clear />
          <add key="nuget.org" value="${NUGET_SOURCE}" protocolVersion="3" />
        </packageSources>
      </configuration>
      EOF

      echo ""
      echo "=== NuGet Sources ==="

      dotnet nuget list source \
        --configfile ./NuGet.CI.Config

      echo ""
      echo "=== Restore ==="

      time dotnet restore "./$SOLUTION" \
        --configfile ./NuGet.CI.Config \
        --packages "$NUGET_PACKAGES" \
        '-p:WarningsAsErrors=NU1900%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      echo ""
      echo "=== Build ==="

      time dotnet build "./$SOLUTION" \
        -c Release \
        --no-restore

      echo ""
      echo "=== Release test suites ==="
      mkdir -p artifacts/catalogue-release/test-results
      for suite in Wallets Catalogue Hotels Entertainments Orders Flights Store SupplyChain Cinema; do
        dotnet test "tests/Refahi.Modules.${suite}.Tests/Refahi.Modules.${suite}.Tests.csproj" \
          -c Release --no-build --no-restore \
          --logger "trx;LogFileName=${suite}.trx" \
          --results-directory artifacts/catalogue-release/test-results
      done
      echo "=== NuGet security audit ==="
      for audit_attempt in 1 2 3; do
        echo "NuGet security audit attempt $audit_attempt/3"
        if dotnet list "./$SOLUTION" package --no-restore \
          --config ./NuGet.CI.Config --vulnerable --include-transitive --format json \
          > artifacts/catalogue-release/security-audit.json \
          2> artifacts/catalogue-release/security-audit.stderr.log; then
          echo "NuGet security audit report generated."
          break
        else
          audit_exit=$?
          cat artifacts/catalogue-release/security-audit.json
          cat artifacts/catalogue-release/security-audit.stderr.log >&2
          if [ "$audit_attempt" -eq 3 ]; then
            exit "$audit_exit"
          fi
        fi
        sleep 5
      done

      echo "=== Publish API ==="

      rm -rf "./$PUBLISH_DIR"

      # Restore for the target RID so native dependencies from other platforms are excluded.
      time dotnet restore "./$API_CSPROJ" \
        --runtime "$API_RUNTIME" \
        --configfile ./NuGet.CI.Config \
        --packages "$NUGET_PACKAGES" \
        -p:SelfContained=false \
        -p:UseAppHost=false

      time dotnet publish "./$API_CSPROJ" \
        -c Release \
        --runtime "$API_RUNTIME" \
        --self-contained false \
        --no-restore \
        -p:UseAppHost=false \
        -p:PlaywrightPlatform="$API_RUNTIME" \
        -p:CopyOutputSymbolsToPublishDirectory=false \
        -o "./$PUBLISH_DIR"

      echo ""
      echo "=== Validate Publish ==="

      test -f "./$PUBLISH_DIR/Refahi.Api.dll"
      test -f "./$PUBLISH_DIR/libSkiaSharp.so"

      du -sh "./$PUBLISH_DIR"

      echo ""
      echo "Build completed successfully."

  artifacts:
    when: always
    expire_in: 1 hour

    paths:
      - publish/api/
      - artifacts/catalogue-release/

    reports:
      dotenv: build.env


# ============================================================
# DOCKER BUILD + PUSH
# ============================================================

docker_build_push:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev")'
  stage: docker

  image: registry.refahi.xyz/platform/ci-images/docker-cli:29.7.2

  needs:
    - job: verify_catalogue_release
      artifacts: false
    - job: build_publish
      artifacts: true

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - |
      set -eu

      IMAGE_ENV="$CI_REGISTRY_IMAGE:$ENV"
      IMAGE_VER="$CI_REGISTRY_IMAGE:$BUILD_VERSION"

      echo "Environment image: $IMAGE_ENV"
      echo "Version image: $IMAGE_VER"

      echo ""
      echo "=== Validate Publish Output ==="

      test -f "./$PUBLISH_DIR/Refahi.Api.dll"

      echo ""
      echo "=== Create Runtime Dockerfile ==="

      cat > "./$PUBLISH_DIR/Dockerfile.ci" <<'EOF'
      FROM registry.refahi.xyz/platform/ci-images/aspnet:10.0

      WORKDIR /app
      RUN dotnet --list-runtimes | awk '$1 == "Microsoft.AspNetCore.App" {split($2,v,"."); if (v[1]==10 && (v[2]>0 || v[3]>=13)) ok=1} END {exit !ok}'

      EXPOSE 8080

      COPY . .

      ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      RUN playwright_node=$(find /app/.playwright/node -type f -name node | head -n 1) \
          && "$playwright_node" /app/.playwright/package/cli.js install --with-deps chromium \
          && "$playwright_node" -e 'const { chromium } = require("./.playwright/package"); (async () => { \
              const browser = await chromium.launch({ headless: true }); \
              try { \
                  const page = await browser.newPage(); \
                  await page.setContent("<!doctype html><p>Cinema PDF smoke test</p>"); \
                  const pdf = await page.pdf({ format: "A4" }); \
                  if (pdf.subarray(0, 5).toString() !== "%PDF-") throw new Error("Invalid PDF"); \
              } finally { await browser.close(); } \
          })().catch(error => { console.error(error); process.exit(1); });'

      ENTRYPOINT ["dotnet", "Refahi.Api.dll"]
      EOF

      echo ""
      echo "=== Docker Build ==="

      # Runner-level DOCKER_AUTH_CONFIG remains active here
      # so the shared ASP.NET runtime image can be pulled.
      time docker build --pull \
        --provenance=false \
        --file "./$PUBLISH_DIR/Dockerfile.ci" \
        --tag "$IMAGE_ENV" \
        --tag "$IMAGE_VER" \
        "./$PUBLISH_DIR"

      echo ""
      mkdir -p artifacts/catalogue-release
      docker run --rm --network none --entrypoint dotnet "$IMAGE_VER" --list-runtimes > artifacts/catalogue-release/runtime.txt
      docker image inspect "$IMAGE_VER" --format '{{json .Id}}' > artifacts/catalogue-release/image-id.json
      docker image inspect registry.refahi.xyz/platform/ci-images/aspnet:10.0 --format '{{json .RepoDigests}}' > artifacts/catalogue-release/runtime-image-digests.json

      echo "=== Switch Registry Credentials ==="

      # DOCKER_AUTH_CONFIG is read-only for platform/ci-images.
      # Remove it before authenticating for application image push.
      unset DOCKER_AUTH_CONFIG

      rm -f /root/.docker/config.json
      mkdir -p /root/.docker

      echo "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      echo ""
      echo "=== Push Environment Image ==="

      time docker push "$IMAGE_ENV"

      echo ""
      echo "=== Push Version Image ==="

      time docker push "$IMAGE_VER"
      docker image inspect "$IMAGE_VER" --format '{{json .RepoDigests}}' > artifacts/catalogue-release/published-image-digests.json

      echo ""
      echo "========================================"
      echo " Image published successfully"
      echo "========================================"
      echo "Environment : $IMAGE_ENV"
      echo "Version     : $IMAGE_VER"

  artifacts:
    when: always
    paths:
      - artifacts/catalogue-release/

  after_script:
    - |
      docker image rm \
        "$CI_REGISTRY_IMAGE:${ENV:-unused}" \
        "$CI_REGISTRY_IMAGE:${BUILD_VERSION:-unused}" \
        >/dev/null 2>&1 || true


# ============================================================
# OPTIONAL DEPLOY NOTIFICATION
# ============================================================

notify_deploy_agent:
  stage: notify

  image: registry.refahi.xyz/platform/ci-images/curl:8.6.0

  needs:
    - job: build_publish
      artifacts: true

    - job: docker_build_push

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $DEPLOY_AGENT_URL && $DEPLOY_AGENT_TOKEN'
      when: on_success

    - when: never

  script:
    - |
      set -eu

      echo "Notify deploy-agent:"
      echo "Service: $SERVICE_NAME"
      echo "Environment: $ENV"

      curl \
        --fail \
        --silent \
        --show-error \
        --request POST \
        "$DEPLOY_AGENT_URL" \
        --header "Content-Type: application/json" \
        --header "Authorization: Bearer $DEPLOY_AGENT_TOKEN" \
        --data "{\"service\":\"$SERVICE_NAME\",\"env\":\"$ENV\"}" \
        --max-time 180

verify_catalogue_release:
  stage: verify
  image: python:3.13-slim
  needs:
    - job: build_publish
      artifacts: true
  script:
    - python -m unittest discover -s tools/tests -p "test_*.py"
    - python tools/verify-catalogue-release.py --audit artifacts/catalogue-release/security-audit.json --trx artifacts/catalogue-release/test-results --deps publish/api/Refahi.Api.deps.json --require-integration --output artifacts/catalogue-release/evidence.json
  artifacts:
    when: always
    reports:
      junit: artifacts/catalogue-release/evidence.junit.xml
    paths:
      - artifacts/catalogue-release/
