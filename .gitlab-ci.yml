stages:
  - build
  - docker
  - notify

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never

variables:
  SOLUTION: "Refahi.Backend.slnx"
  API_CSPROJ: "src/Refahi.Api/Refahi.Api.csproj"
  SERVICE_NAME: "api"
  PUBLISH_DIR: "publish/api"

  # NuGet
  NUGET_PACKAGES: ".nuget/packages"
  NUGET_SOURCE: "https://mirror2.chabokan.net/nuget/v3/index.json"
  NUGET_XMLDOC_MODE: "skip"

  # .NET
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

  # Docker
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

default:
  tags:
    - refahiplus-docker

  cache:
    key: "nuget-${CI_PROJECT_ID}"
    paths:
      - .nuget/packages/
    policy: pull-push


# ============================================================
# BUILD / TEST / PUBLISH
# ============================================================

docker_build_push:
  stage: docker

  image: registry.refahi.xyz/platform/ci-images/docker-cli:29.7.2

  needs:
    - job: build_publish
      artifacts: true

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - |
      set -eu

      IMAGE_ENV="$CI_REGISTRY_IMAGE:$ENV"
      IMAGE_VER="$CI_REGISTRY_IMAGE:$BUILD_VERSION"

      echo "Environment image: $IMAGE_ENV"
      echo "Version image: $IMAGE_VER"

      echo ""
      echo "=== Validate Publish Output ==="

      test -f "./$PUBLISH_DIR/Refahi.Api.dll"

      echo ""
      echo "=== Create Runtime Dockerfile ==="

      cat > "./$PUBLISH_DIR/Dockerfile.ci" <<'EOF'
      FROM registry.refahi.xyz/platform/ci-images/aspnet:10.0

      WORKDIR /app

      EXPOSE 8080

      COPY . .

      ENTRYPOINT ["dotnet", "Refahi.Api.dll"]
      EOF

      echo ""
      echo "=== Docker Build ==="

      # DOCKER_AUTH_CONFIG is intentionally kept here.
      # It provides read access to platform/ci-images.
      time docker build \
        --provenance=false \
        --file "./$PUBLISH_DIR/Dockerfile.ci" \
        --tag "$IMAGE_ENV" \
        --tag "$IMAGE_VER" \
        "./$PUBLISH_DIR"

      echo ""
      echo "=== Switch Registry Credentials ==="

      # Runner-level DOCKER_AUTH_CONFIG contains the read-only
      # credential for platform/ci-images.
      # It must not be used for pushing application images.
      unset DOCKER_AUTH_CONFIG

      # Remove any stale Docker CLI credentials in the job container.
      rm -f /root/.docker/config.json
      mkdir -p /root/.docker

      echo "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      echo ""
      echo "=== Push Environment Image ==="

      time docker push "$IMAGE_ENV"

      echo ""
      echo "=== Push Version Image ==="

      time docker push "$IMAGE_VER"

      echo ""
      echo "========================================"
      echo " Image published successfully"
      echo "========================================"

      echo "Environment : $IMAGE_ENV"
      echo "Version     : $IMAGE_VER"

  after_script:
    - |
      docker image rm \
        "$CI_REGISTRY_IMAGE:${ENV:-unused}" \
        "$CI_REGISTRY_IMAGE:${BUILD_VERSION:-unused}" \
        >/dev/null 2>&1 || true

# ============================================================
# DOCKER BUILD + PUSH
#
# مهم:
# این Job دیگر Dockerfile اصلی پروژه را استفاده نمی‌کند.
# بنابراین داخل docker build هیچ dotnet restore انجام نمی‌شود.
# ============================================================

docker_build_push:
  stage: docker

  image: registry.refahi.xyz/platform/ci-images/docker-cli:29.7.2

  needs:
    - job: build_publish
      artifacts: true

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - |
      set -eu

      IMAGE_ENV="$CI_REGISTRY_IMAGE:$ENV"
      IMAGE_VER="$CI_REGISTRY_IMAGE:$BUILD_VERSION"

      echo "Environment image: $IMAGE_ENV"
      echo "Version image: $IMAGE_VER"

      echo ""
      echo "=== Validate Publish Output ==="

      test -f "./$PUBLISH_DIR/Refahi.Api.dll"

      echo ""
      echo "=== Create Runtime Dockerfile ==="

      cat > "./$PUBLISH_DIR/Dockerfile.ci" <<'EOF'
      FROM registry.refahi.xyz/platform/ci-images/aspnet:10.0


      WORKDIR /app

      EXPOSE 8080

      COPY . .

      ENTRYPOINT ["dotnet", "Refahi.Api.dll"]
      EOF

      echo ""
      echo "=== Docker Build ==="

      time docker build \
        --provenance=false \
        --file "./$PUBLISH_DIR/Dockerfile.ci" \
        --tag "$IMAGE_ENV" \
        --tag "$IMAGE_VER" \
        "./$PUBLISH_DIR"

      echo ""
      echo "=== Push Environment Image ==="

      time docker push "$IMAGE_ENV"

      echo ""
      echo "=== Push Version Image ==="

      time docker push "$IMAGE_VER"

      echo ""
      echo "Images published:"
      echo "$IMAGE_ENV"
      echo "$IMAGE_VER"

  after_script:
    - |
      docker image rm \
        "$CI_REGISTRY_IMAGE:${ENV:-unused}" \
        "$CI_REGISTRY_IMAGE:${BUILD_VERSION:-unused}" \
        >/dev/null 2>&1 || true

      docker logout "$CI_REGISTRY" \
        >/dev/null 2>&1 || true


# ============================================================
# OPTIONAL DEPLOY NOTIFICATION
# ============================================================

notify_deploy_agent:
  stage: notify

  image: registry.refahi.xyz/platform/ci-images/curl:8.6.0

  needs:
    - job: build_publish
      artifacts: true

    - job: docker_build_push

  rules:
    - if: '$DEPLOY_AGENT_URL && $DEPLOY_AGENT_TOKEN'
      when: on_success

    - when: never

  script:
    - |
      set -eu

      echo "Notify deploy-agent:"
      echo "Service: $SERVICE_NAME"
      echo "Environment: $ENV"

      curl \
        --fail \
        --silent \
        --show-error \
        --request POST \
        "$DEPLOY_AGENT_URL" \
        --header "Content-Type: application/json" \
        --header "Authorization: Bearer $DEPLOY_AGENT_TOKEN" \
        --data "{\"service\":\"$SERVICE_NAME\",\"env\":\"$ENV\"}" \
        --max-time 180