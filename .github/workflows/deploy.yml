name: Manual build validation (GitLab owns releases)
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ./Refahi.Backend.slnx
      - run: dotnet build ./Refahi.Backend.slnx -c Release --no-restore
